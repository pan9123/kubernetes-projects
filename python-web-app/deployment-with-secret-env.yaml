apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: python-sample-app
        image: pankajf5/python-sample-app-demo:v1

        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db-user

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: db-password

        ports:
        - containerPort: 8000
