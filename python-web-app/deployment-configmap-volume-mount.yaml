apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: python-sample-app
        image: pankajf5/python-sample-app-demo:v1
        volumeMounts:
          - name: db-connection 
            mountPath: "/opt"
        ports:
        - containerPort: 8000
      volumes:                                    # You set volumes at the Pod level, then mount them into containers inside that Pod
       - name: db-connection
         configMap:
           name: test-cm                          # Provide the name of the ConfigMap you want to mount.
