apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample-python-app

  template:
    metadata:
      labels:
        app: sample-python-app

    spec:
      containers:
      - name: python-sample-app
        image: pankajf5/python-sample-app-demo:v1

        volumeMounts:
        - name: db-secret-volume
          mountPath: "/opt/secrets"
          readOnly: true

        ports:
        - containerPort: 8000

      volumes:
      - name: db-secret-volume
        secret:
          secretName: db-secret
